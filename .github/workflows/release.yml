# Сборка и выкладка Naivka на страницу Releases. Запускается:
#  - сменой номера в файле VERSION в ветке main (например 2.1.0 → тег v2.1.0, его создаст сам релиз);
#  - тегом (git tag v2.1.0 && git push origin v2.1.0);
#  - вручную: Actions → «Release» → Run workflow, указать тег.
# Сторонние действия закреплены по хешу коммита (а не по метке, которую можно перевесить):
# этот сценарий выкладывает файлы, которые программа ставит пользователям по кнопке «Обновить».
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    # Смена сценария тоже пересобирает текущую версию: релиз с тем же тегом обновится, файлы заменятся.
    paths: [VERSION, .github/workflows/release.yml]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, например v2.1.0"
        required: true
      prerelease:
        description: "Пометить как предварительный выпуск"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Номер версии
        run: |
          if [ -n "${{ inputs.tag }}" ]; then TAG="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}"
          else TAG="v$(tr -d ' \r\n' < VERSION)"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # Тег с дефисом (v2.4.0-beta.1) — бета: предварительный выпуск, не «последний».
          # Его получают только те, кто выбрал канал обновлений «Бета».
          case "$TAG" in *-*) echo "PRE=true" >> "$GITHUB_ENV";; *) echo "PRE=${{ inputs.prerelease == true }}" >> "$GITHUB_ENV";; esac
          echo "Релиз $TAG"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Тесты
        run: go test -mod=vendor ./...

      # Сведения о программе в exe (название, версия, описание): без них антивирусы чаще
      # принимают неподписанную программу на Go за подозрительную.
      - name: Сведения о версии в exe
        run: |
          V="${TAG#v}"; IFS=. read -r MA MI PA <<< "${V%%-*}"  # у беты числа без «-beta.N»
          GVI="go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.4.1"
          ARGS="-ver-major=$MA -ver-minor=$MI -ver-patch=$PA -product-ver-major=$MA -product-ver-minor=$MI -product-ver-patch=$PA -file-version=$V -product-version=$V"
          $GVI -64 -o rsrc_windows_amd64.syso $ARGS versioninfo.json
          $GVI -o rsrc_windows_386.syso $ARGS versioninfo.json
          $GVI -arm -64 -o rsrc_windows_arm64.syso $ARGS versioninfo.json

      - name: Windows 10/11 (64 бита)
        env:
          GOOS: windows
          GOARCH: amd64
          LD: -s -w -X main.appVersion=${{ env.TAG }}
        run: |
          mkdir -p out/Naivka
          go build -mod=vendor -trimpath -ldflags "-H windowsgui $LD" -o out/Naivka/Naivka.exe .
          go build -mod=vendor -trimpath -ldflags "$LD" -o out/Naivka/Naivka-debug.exe .
          printf 'Если рядом с программой лежит этот файл, настройки и ядро хранятся в папке Naivka-data рядом с ней.\r\n' > out/Naivka/portable.txt
          # Инструкция для тех, кто открыл архив: UTF-8 с BOM и CRLF, чтобы читалась и в Блокноте Windows 7.
          # Имя латиницей: zip не помечает кириллицу как UTF-8, и Проводник показал бы кракозябры.
          { printf '\xEF\xBB\xBF'; sed 's/$/\r/' assets/install-ru.txt; } > out/Naivka/README.txt
          (cd out && zip -qr Naivka-${{ env.TAG }}-windows.zip Naivka)

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.20.14"

      - name: Windows 7/8 (64 и 32 бита)
        env:
          GOOS: windows
          GOTOOLCHAIN: local
          LD: -s -w -H windowsgui -X main.appVersion=${{ env.TAG }}
        run: |
          mkdir -p out/Naivka-win7
          { printf '\xEF\xBB\xBF'; sed 's/$/\r/' assets/install-ru.txt; } > out/Naivka-win7/README.txt
          GOARCH=amd64 go build -modfile=go.legacy.mod -mod=mod -tags legacy -trimpath -ldflags "$LD" -o out/Naivka-win7/Naivka-win7-64.exe .
          GOARCH=386 go build -modfile=go.legacy.mod -mod=mod -tags legacy -trimpath -ldflags "$LD" -o out/Naivka-win7/Naivka-win7-32.exe .
          (cd out && zip -qr Naivka-${{ env.TAG }}-windows7.zip Naivka-win7)

      - name: Контрольные суммы
        run: cd out && sha256sum *.zip > SHA256SUMS.txt

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.TAG }}
          name: Naivka ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.PRE == 'true' }}
          make_latest: ${{ env.PRE != 'true' }}
          body: |
            ${{ env.PRE == 'true' && '**Бета-версия.** Её получают только те, кто в Naivka выбрал «Настройки → О программе → Канал обновлений: Бета». Если что-то сломалось — вернитесь на «Стабильные» и пришлите отчёт.' || '' }}

            **Уже стоит Naivka?** Ничего скачивать не нужно: на главном экране программы появится
            «Вышла Naivka ${{ env.TAG }}» — нажмите «Обновить», она обновится и перезапустится сама.
            Настройки и серверы сохранятся. (Версии до 2.3.4 так не умеют — один раз скачайте архив
            ниже и распакуйте поверх старой папки.)

            **Первая установка**
            1. Скачайте архив ниже: `Naivka-${{ env.TAG }}-windows.zip` — Windows 10 и 11;
               `Naivka-${{ env.TAG }}-windows7.zip` — Windows 7 и 8.
            2. Распакуйте его целиком в удобную папку, например на рабочий стол (правой кнопкой → «Извлечь всё»).
               Из архива не запускайте — настройки не сохранятся.
            3. Запустите `Naivka.exe`. Если Windows покажет «Система Windows защитила ваш компьютер» —
               «Подробнее» → «Выполнить в любом случае» (программа не подписана сертификатом).
            4. Откроется подсказка «Как пользоваться»: добавьте сервер по ссылке и нажмите большую кнопку.

            `SHA256SUMS.txt` — контрольные суммы архивов. Сборка из исходников (${{ github.sha }}).
          files: |
            out/*.zip
            out/SHA256SUMS.txt
