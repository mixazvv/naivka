# Сборка и выкладка Naivka на страницу Releases. Запускается:
#  - сменой номера в файле VERSION в ветке main (например 2.1.0 → тег v2.1.0, его создаст сам релиз);
#  - тегом (git tag v2.1.0 && git push origin v2.1.0);
#  - вручную: Actions → «Release» → Run workflow, указать тег.
# Это сборка без подписи обновлений: в ней автообновление выключено. Подписанный релиз
# с автообновлением выпускает утилита cmd/release на компьютере, где лежит ключ.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, например v2.1.0"
        required: true
      prerelease:
        description: "Пометить как предварительный выпуск"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Номер версии
        run: |
          if [ -n "${{ inputs.tag }}" ]; then TAG="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}"
          else TAG="v$(tr -d ' \r\n' < VERSION)"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Релиз $TAG"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Тесты
        run: go test -mod=vendor ./...

      - name: Windows 10/11 (64 бита)
        env:
          GOOS: windows
          GOARCH: amd64
          LD: -s -w -X main.appVersion=${{ env.TAG }}
        run: |
          mkdir -p out/Naivka
          go build -mod=vendor -trimpath -ldflags "-H windowsgui $LD" -o out/Naivka/Naivka.exe .
          go build -mod=vendor -trimpath -ldflags "$LD" -o out/Naivka/Naivka-debug.exe .
          printf 'Если рядом с программой лежит этот файл, настройки и ядро хранятся в папке Naivka-data рядом с ней.\r\n' > out/Naivka/portable.txt
          (cd out && zip -qr Naivka-${{ env.TAG }}-windows.zip Naivka)

      - uses: actions/setup-go@v5
        with:
          go-version: "1.20.14"

      - name: Windows 7/8 (64 и 32 бита)
        env:
          GOOS: windows
          GOTOOLCHAIN: local
          LD: -s -w -H windowsgui -X main.appVersion=${{ env.TAG }}
        run: |
          mkdir -p out/Naivka-win7
          GOARCH=amd64 go build -modfile=go.legacy.mod -mod=mod -tags legacy -trimpath -ldflags "$LD" -o out/Naivka-win7/Naivka-win7-64.exe .
          GOARCH=386 go build -modfile=go.legacy.mod -mod=mod -tags legacy -trimpath -ldflags "$LD" -o out/Naivka-win7/Naivka-win7-32.exe .
          (cd out && zip -qr Naivka-${{ env.TAG }}-windows7.zip Naivka-win7)

      - name: Контрольные суммы
        run: cd out && sha256sum *.zip > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Naivka ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.event_name == 'push' || inputs.prerelease }}
          body: |
            Сборка из исходников (${{ github.sha }}).

            - `Naivka-${{ env.TAG }}-windows.zip` — Windows 10 и 11, 64 бита. Распакуйте и запустите `Naivka.exe`;
              ядро sing-box программа предложит скачать при первом запуске.
            - `Naivka-${{ env.TAG }}-windows7.zip` — Windows 7 и 8, 64 и 32 бита.
            - `SHA256SUMS.txt` — контрольные суммы архивов.

            Файлы не подписаны: Windows SmartScreen может предупредить при первом запуске. Автообновление в этой сборке выключено.
          files: |
            out/*.zip
            out/SHA256SUMS.txt
