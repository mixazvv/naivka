name: CI

# Проверка на каждый PR и пуш в main: тесты с поиском гонок (когда несколько частей программы
# одновременно трогают одни данные) и сборка под Windows.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Модели интерфейса
        run: |
          node tests/pet-mind.cjs
          node tests/vps-ui.cjs
          node tests/server-scores.cjs
          node tests/branch-geometry.cjs
          python3 scripts/sign-historical-releases.py --check-only
          python3 tests/historical-signatures.py
          python3 tests/mieru-installer.py
      - name: go vet
        run: |
          go vet -mod=vendor ./...
          GOOS=windows go vet -mod=vendor ./...
      - name: Тесты с поиском гонок
        run: go test -race -mod=vendor -count=1 ./...
      - name: Сборка под Windows
        run: |
          GOOS=windows GOARCH=amd64 go build -mod=vendor -o /dev/null .
          GOOS=windows GOARCH=arm64 go build -mod=vendor -o /dev/null .

  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.20.14"
          cache: false
      - name: Compile Windows 7/8
        env:
          GOOS: windows
          GOTOOLCHAIN: local
        run: |
          GOARCH=amd64 go build -modfile=go.legacy.mod -mod=mod -tags legacy -o "$RUNNER_TEMP/Naivka-win7-64.exe" .
          GOARCH=386 go build -modfile=go.legacy.mod -mod=mod -tags legacy -o "$RUNNER_TEMP/Naivka-win7-32.exe" .

  windows-update:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Lifecycle and update processes on Windows
        run: go test -mod=vendor -count=1 -timeout=3m -run "^(TestVersion|TestUpdate|TestSupervisor|TestFinalUpdate|TestLifecycle|TestExeCandidates|TestRepair|TestHomeLayout|TestUnknownHomeLayout|TestServerScores|TestServerChoice|TestServerScoreTick|TestServerFailback)" ./...

  ui-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/ui-tests" playwright@1.62.1
          "$RUNNER_TEMP/ui-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Kitten, layout and diagrams in Chromium
        env:
          NODE_PATH: ${{ runner.temp }}/ui-tests/node_modules
          CONTROL_SCREENSHOTS: ${{ runner.temp }}/control-screenshots
        run: |
          ui_exit_status=0
          node tests/pet-offline.browser.cjs || ui_exit_status=1
          node tests/layout-diagrams.browser.cjs || ui_exit_status=1
          node tests/repair-transaction.browser.cjs || ui_exit_status=1
          node tests/version-picker.browser.cjs || ui_exit_status=1
          node tests/check-cards.browser.cjs || ui_exit_status=1
          node tests/settings.browser.cjs || ui_exit_status=1
          node tests/compact-workspace.browser.cjs || ui_exit_status=1
          exit "$ui_exit_status"

      - name: Checkbox card previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checkbox-cards
          path: ${{ runner.temp }}/control-screenshots
          if-no-files-found: ignore
          retention-days: 14
