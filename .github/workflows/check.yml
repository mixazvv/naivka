name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: go test -mod=vendor ./...
      - run: go test -mod=vendor -race ./...
      - run: go vet -mod=vendor ./...
      - name: Compile Windows
        run: |
          GOOS=windows GOARCH=amd64 go build -mod=vendor -o "$RUNNER_TEMP/Naivka-amd64.exe" .
          GOOS=windows GOARCH=arm64 go build -mod=vendor -o "$RUNNER_TEMP/Naivka-arm64.exe" .

  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.20.14"
          cache: false
      - name: Compile Windows 7/8
        env:
          GOOS: windows
          GOTOOLCHAIN: local
        run: |
          GOARCH=amd64 go build -modfile=go.legacy.mod -mod=mod -tags legacy -o "$RUNNER_TEMP/Naivka-win7-64.exe" .
          GOARCH=386 go build -modfile=go.legacy.mod -mod=mod -tags legacy -o "$RUNNER_TEMP/Naivka-win7-32.exe" .
