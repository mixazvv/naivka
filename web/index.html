<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Naivka</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%233146C6%22/%3E%3Cpath d=%22M6 16h20%22 stroke=%22white%22 stroke-width=%222.4%22/%3E%3Ccircle cx=%226.5%22 cy=%2216%22 r=%223.2%22 fill=%22%233146C6%22 stroke=%22white%22 stroke-width=%222.2%22/%3E%3Ccircle cx=%2225.5%22 cy=%2216%22 r=%223.2%22 fill=%22%233146C6%22 stroke=%22white%22 stroke-width=%222.2%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%225%22 fill=%22white%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="app.css">
</head>
<body data-state="off">
  <header class="titlebar" id="titlebar" hidden>
    <div class="tb-drag" id="tbDrag">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect class="logo-bg" width="32" height="32" rx="7"/><path d="M6 16h20" stroke="#fff" stroke-width="2.4"/><circle cx="6.5" cy="16" r="3.2" class="logo-bg" stroke="#fff" stroke-width="2.2"/><circle cx="25.5" cy="16" r="3.2" class="logo-bg" stroke="#fff" stroke-width="2.2"/><circle cx="16" cy="16" r="5" fill="#fff"/></svg>
      <span class="tb-name">Naivka</span>
      <span class="tb-status"><span class="led"></span><span id="tbStatus">Отключено</span></span>
    </div>
    <div class="tb-buttons">
      <button class="tb-btn" data-cmd="min" aria-label="Свернуть" title="Свернуть"><svg viewBox="0 0 10 10"><path d="M0 5.5h10"/></svg></button>
      <button class="tb-btn" data-cmd="max" id="tbMax" aria-label="Развернуть" title="Развернуть"><svg viewBox="0 0 10 10"><rect class="tb-max" x=".5" y=".5" width="9" height="9" rx="1"/><path class="tb-restore" d="M2.5 2.5V1.5a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-1M.5 3.5a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1z"/></svg></button>
      <button class="tb-btn close" data-cmd="close" aria-label="Закрыть" title="Закрыть"><svg viewBox="0 0 10 10"><path d="M.5.5l9 9M9.5.5l-9 9"/></svg></button>
    </div>
    <div class="tb-edge n" data-edge="n"></div><div class="tb-edge nw" data-edge="nw"></div><div class="tb-edge ne" data-edge="ne"></div>
  </header>
  <div class="shell">
    <header class="topbar">
      <button class="brand" type="button" data-view="overview" title="Главный экран"><svg viewBox="0 0 32 32" aria-hidden="true"><rect class="logo-bg" width="32" height="32" rx="7"/><path d="M6 16h20" stroke="#fff" stroke-width="2.4"/><circle cx="6.5" cy="16" r="3.2" class="logo-bg" stroke="#fff" stroke-width="2.2"/><circle cx="25.5" cy="16" r="3.2" class="logo-bg" stroke="#fff" stroke-width="2.2"/><circle cx="16" cy="16" r="5" fill="#fff"/></svg><span>Naivka</span></button>
      <nav class="tabs" aria-label="Разделы">
        <button class="nav-item" data-view="servers">Серверы</button>
        <button class="nav-item" data-view="own">Свой сервер</button>
        <button class="nav-item" data-view="bypass">Обход<span class="nav-badge" id="navBadge" hidden></span></button>
        <button class="nav-item" data-view="rules">Правила</button>
        <button class="nav-item" data-view="diag">Сводка</button>
        <button class="nav-item" data-view="settings">Настройки</button>
      </nav>
      <div class="pill" id="navStatus"><span class="led"></span><span><span id="navTitle">Отключено</span><small id="navSub"></small></span></div>
      <button class="feedback" type="button" id="feedbackBtn" title="Написать автору в Telegram: @mixazvv">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4L3 11.5l6.5 2.2M21 4l-3 16-8.5-6.3M21 4L9.5 13.7v5.8l3.2-3.7"/></svg><span>Обратная связь</span>
      </button>
    </header>
    <div class="stage-wrap">
      <div class="ambient" aria-hidden="true"><div class="bokeh"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
      <main class="main stage" id="main" tabindex="-1"></main>
      <div class="scrim" id="scrim" hidden></div>
      <aside class="drawer" id="drawer" aria-label="Раздел" hidden>
        <button class="drawer-close" type="button" id="drawerClose" title="Закрыть (Esc)" aria-label="Закрыть">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <div class="drawer-body" id="drawerBody"></div>
      </aside>
    </div>
    <footer class="hintbar">
      <span class="hb-left"><span class="hb-code">NVK</span><span id="hbSession">канал закрыт</span></span>
      <span class="hb-xp" aria-hidden="true"><i id="hbXp"></i></span>
      <span class="hb-keys">
        <span><kbd>1</kbd>–<kbd>7</kbd> Разделы</span>
        <span><kbd>Ctrl</kbd>+<kbd>Enter</kbd> <span id="hbToggle">Подключить</span></span>
        <span><kbd>Esc</kbd> Назад</span>
      </span>
    </footer>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="offline" id="offline" hidden>
    <div>
      <h2>Naivka не отвечает</h2>
      <p id="offlineText">Приложение закрыто или перезапускается. Запустите Naivka снова, и окно откроется.</p>
    </div>
  </div>
  <input type="file" id="fileInput" accept=".json,.txt,.list,.conf,.lst,text/plain,application/json" hidden>
  <div class="mini" id="mini" hidden></div>
  <script src="qrcode.js"></script>
  <script src="worldmap.js"></script>
  <script src="design.js"></script>
  <script src="app.js"></script>
</body>
</html>
